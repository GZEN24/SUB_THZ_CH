name: Reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the complete 36-check reproduction (slow)"
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environment/requirements.txt
      - name: Install the reference dependencies
        run: python -m pip install -r environment/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compare reproduced and reported results
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          if [[ "${{ inputs.full }}" == "true" ]]; then
            python code/reproduce_validation.py
          else
            python code/reproduce_validation.py --skip-loo --skip-mlp
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-report
          path: results/reproduced/
          if-no-files-found: ignore
